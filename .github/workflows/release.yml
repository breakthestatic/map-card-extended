name: Releases

on:
  push:
    tags:
    - 'v*'

jobs:

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: npm ci
    - name: Build
      run: npm run build
    - uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/map-card-extended.js"
        generateReleaseNotes: true
